# Build the website and publish it to GitHub Pages. It only runs when started
# by hand: Actions > Deploy website > Run workflow.
#
# The site takes its art, fonts and card data from the game repository, which
# is checked out next to it during the build. Settings (Settings > Secrets and
# variables > Actions):
#
#   GAME_REPOSITORY  variable, optional: "owner/name" of the game repository.
#                    Defaults to shandalar-forever under this repository's owner.
#   GAME_REPO_TOKEN  secret, needed only while the game repository is private:
#                    a fine-grained token with read access to its contents.

name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Check out the game's assets
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.GAME_REPOSITORY || format('{0}/shandalar-forever', github.repository_owner) }}
          token: ${{ secrets.GAME_REPO_TOKEN || github.token }}
          path: game
          sparse-checkout: assets/original
          sparse-checkout-cone-mode: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build the site
        run: uv run --locked shandalar-site build --assets game/assets/original --out _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
