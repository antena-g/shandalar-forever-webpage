# Build the website and publish it to GitHub Pages. It only runs when started
# by hand: Actions > Deploy website > Run workflow.

name: Deploy website

on:
  workflow_dispatch:
    inputs:
      game_ref:
        description: "Game commit to build (must be pushed, including its Phase submodule)"
        required: true
        default: "4cb16c94b976aa039714812a0db79a2cede2cace"

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Check game source credentials
        env:
          GAME_SOURCE_TOKEN: ${{ secrets.GAME_SOURCE_TOKEN }}
        run: |
          if [ -z "$GAME_SOURCE_TOKEN" ]; then
            echo "::error::Add GAME_SOURCE_TOKEN to this website repository's Actions secrets. It needs Contents read access to antena-g/shandalar-forever and antena-g/phase-shandalar."
            exit 1
          fi

      - name: Check out the development game
        uses: actions/checkout@v5
        with:
          repository: antena-g/shandalar-forever
          token: ${{ secrets.GAME_SOURCE_TOKEN }}
          persist-credentials: false
          ref: ${{ inputs.game_ref }}
          path: game-source
          submodules: recursive

      - name: Build the production browser game
        working-directory: game-source
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown --bin shandalar
          cargo install wasm-bindgen-cli --locked --version 0.2.129
          wasm-bindgen target/wasm32-unknown-unknown/release/shandalar.wasm --out-dir web/pkg --target web

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check portable browser packaging
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build the site
        run: uv run --locked shandalar-site build --out _site --game-web game-source/web

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
