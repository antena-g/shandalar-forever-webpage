[project]
name = "shandalar-site"
version = "0.1.0"
description = "Static website for Shandalar Forever"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "pillow>=10.0",
]

[project.scripts]
shandalar-site = "shandalar_site.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shandalar_site"]
